<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Pets - Mis Citas</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/citas.css">
</head>
<body>

<div class="app-container">
    <!-- Barra Lateral -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="logo-V.png" alt="Logo Veterinaria">
            <div>
                <h1>Healthy Pets</h1>
                <span>Clínica Veterinaria</span>
            </div>
        </div>

       <nav class="sidebar-nav">
    <!-- El botón de Inicio ahora redirige al login -->
   <nav class="sidebar-nav">
        <a href="login.html" class="nav-item">
          <i class='fa-solid fa-house'></i> <span>Inicio</span>
        </a>
        <a href="index.html" class="nav-item active">
          <i class='fa-regular fa-calendar-days'></i> <span>Agendar cita</span>
        </a>
        <a href="citas.html" class="nav-item">
          <i class='fa-solid fa-bars'></i> <span>Mis citas</span>
        </a>
        <a href="perfil.html" class="nav-item">
          <i class='fa-regular fa-user'></i> <span>Perfil</span>
        </a>
      </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
        <header class="top-header">
            <div class="user-profile"><span>👤 Usuario</span></div>
        </header>

        <div class="form-container-wrapper" style="padding: 40px;">
            <h2>Mis Citas Registradas</h2>
            <p>Aquí podrás visualizar el historial de las citas de tus mascotas.</p>
            <!-- Contenedor del listado -->
            <div id="lista-citas" style="background: white; padding: 20px; border-radius: 12px; margin-top: 20px;">
                <p>No hay citas registradas todavía.</p>
            </div>
        </div>
    </main>
</div>

</body>
</html>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const contenedor = document.getElementById("contenedor-mis-citas");
    const citasGuardadas = JSON.parse(localStorage.getItem("citasGuardadas")) || [];

    if (citasGuardadas.length === 0) {
      contenedor.innerHTML = `<p style="text-align: center; color: #666; padding: 20px;">No hay citas registradas todavía.</p>`;
      return;
    }

    contenedor.innerHTML = ""; // Limpiar contenedor

    citasGuardadas.forEach((cita, index) => {
      const tarjeta = document.createElement("div");
      tarjeta.className = "cita-card-detalle";

      tarjeta.innerHTML = `
        <div class="cita-header-bar">
          <span>Detalle de Cita</span>
          <span>#0${index + 1}</span>
        </div>
        <div class="cita-body">
          <div class="cita-info-top">
            <div class="pet-avatar">🐶</div>
            <div class="pet-main-info">
              <h3>${cita.mascota}</h3>
              <p>${cita.especie} - ${cita.raza || 'No especificada'}</p>
            </div>
            <span class="badge-confirmada">Confirmada</span>
          </div>

          <div class="cita-detail-row">
            <span class="label">👤 Dueño:</span>
            <span class="value">${cita.dueno}</span>
          </div>
          <div class="cita-detail-row">
            <span class="label">🐾 Especie:</span>
            <span class="value">${cita.especie}</span>
          </div>
          <div class="cita-detail-row">
            <span class="label">🐕 Raza:</span>
            <span class="value">${cita.raza || 'N/A'}</span>
          </div>
          <div class="cita-detail-row">
            <span class="label">📋 Motivo:</span>
            <span class="value">${cita.motivo}</span>
          </div>
          <div class="cita-detail-row">
            <span class="label">📅 Fecha:</span>
            <span class="value">${cita.fecha}</span>
          </div>
          <div class="cita-detail-row">
            <span class="label">🕒 Hora:</span>
            <span class="value">${cita.hora}</span>
          </div>

          <div class="cita-actions">
            <button class="btn-accion btn-editar" onclick="alert('Editar cita próximamente')">✏️ Editar</button>
            <button class="btn-accion btn-cancelar" onclick="eliminarCita(${index})">🗑️ Cancelar</button>
          </div>
        </div>
      `;
      contenedor.appendChild(tarjeta);
    });
  });

  function eliminarCita(index) {
    if (confirm("¿Estás seguro de cancelar esta cita?")) {
      let citasGuardadas = JSON.parse(localStorage.getItem("citasGuardadas")) || [];
      citasGuardadas.splice(index, 1);
      localStorage.setItem("citasGuardadas", JSON.stringify(citasGuardadas));
      location.reload();
    }
  }
</script>
