<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Pets - Cita Agendada</title>
    <!-- Hojas de estilo -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/citaex.css">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-container">
    <!-- Barra Lateral (Sidebar) -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="paw-icon-top"><i class="fa-solid fa-paw"></i></div>
            <div>
                <h2>Healthy Pets</h2>
                <span>Clínica Veterinaria</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="login.html" class="nav-item">
                <i class='fa-solid fa-house'></i> <span>Inicio</span>
            </a>
            <a href="index.html" class="nav-item">
                <i class='fa-regular fa-calendar-days'></i> <span>Agendar cita</span>
            </a>
            <a href="citas.html" class="nav-item">
                <i class='fa-solid fa-bars'></i> <span>Mis citas</span>
            </a>
            <a href="perfil.html" class="nav-item">
                <i class='fa-regular fa-user'></i> <span>Perfil</span>
            </a>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
        <!-- Barra Superior -->
        <header class="top-header">
            <div class="user-profile">
                <i class='fa-regular fa-user'></i> Usuario
            </div>
        </header>

        <!-- Tarjeta de Confirmación de Cita -->
        <div class="success-container">
            <div class="success-card">
                
                <!-- Círculo de Verificación con icono -->
                <div class="check-circle">
                    <i class="fa-solid fa-check"></i>
                </div>

                <h2>¡Cita agendada!</h2>
                <p class="success-message">La cita ha sido registrada exitosamente.</p>

                <!-- Botón Ir al Inicio -->
                <a href="citas.html" class="btn-success">Mis Citas</a>
            </div>
        </div>
    </main>
</div>

</body>
</html>
